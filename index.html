<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дровниця в інтер'єрі</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#1e1e1e;font-family:system-ui,sans-serif;color:#fff;overflow:hidden}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  model-viewer{position:fixed;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  button{font:inherit;font-size:15px;padding:12px 16px;border-radius:12px;border:0;background:#fff;color:#222}
  button.ar{background:#1a9e55;color:#fff}
  .hint{position:fixed;top:0;left:0;right:0;padding:12px;text-align:center;font-size:14px;background:rgba(0,0,0,.45)}
  #err{color:#ffb4b4}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<model-viewer id="mv" src="drovnytsia_z_drovamy.glb" alt="Дровниця 1600×500×300 мм"
  camera-controls touch-action="pan-y" camera-orbit="-30deg 80deg auto"
  shadow-intensity="1" exposure="1.1"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor">
  <button slot="ar-button" style="display:none"></button>
</model-viewer>
<div class="hint" id="hint">Один палець — обертати, два — масштаб і зсув</div>
<div class="bar">
  <button id="camBtn">Увімкнути камеру</button>
  <button id="logsBtn">Без дров</button>
  <button id="arBtn" class="ar">Поставити на підлогу (AR)</button>
</div>
<script>
const mv=document.getElementById('mv'),cam=document.getElementById('cam'),hint=document.getElementById('hint');
let stream=null,withLogs=true;
document.getElementById('camBtn').onclick=async e=>{
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cam.style.display='none';e.target.textContent='Увімкнути камеру';return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    cam.srcObject=stream;cam.style.display='block';e.target.textContent='Вимкнути камеру';
    hint.textContent='Камера ввімкнена. Масштаб тут приблизний — для розміру 1:1 натисніть AR';
  }catch(err){hint.innerHTML='<span id="err">Не вдалося відкрити камеру: дозвольте доступ у браузері</span>';}
};
document.getElementById('logsBtn').onclick=e=>{
  withLogs=!withLogs;mv.src=withLogs?'drovnytsia_z_drovamy.glb':'drovnytsia.glb';
  e.target.textContent=withLogs?'Без дров':'З дровами';
};
document.getElementById('arBtn').onclick=()=>{
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cam.style.display='none';document.getElementById('camBtn').textContent='Увімкнути камеру';}
  if(mv.canActivateAR){mv.activateAR();}
  else{hint.innerHTML='<span id="err">Цей телефон або браузер не підтримує AR. Спробуйте Chrome на Android або Safari на iPhone. Режим «Увімкнути камеру» працює і без AR.</span>';}
};
</script>
</body>
</html>
